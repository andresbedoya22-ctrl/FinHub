name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.3"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e_windows:
    name: E2E (Windows) - dashboard + assistant
    needs: ci
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.3"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create .env.local for E2E
        shell: pwsh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:NEXT_PUBLIC_SUPABASE_URL) { throw "Missing secret: NEXT_PUBLIC_SUPABASE_URL" }
          if (-not $env:NEXT_PUBLIC_SUPABASE_ANON_KEY) { throw "Missing secret: NEXT_PUBLIC_SUPABASE_ANON_KEY" }
          if (-not $env:SUPABASE_SERVICE_ROLE_KEY) { throw "Missing secret: SUPABASE_SERVICE_ROLE_KEY" }

          $lines = @(
            "SUPABASE_URL=$env:NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_URL=$env:NEXT_PUBLIC_SUPABASE_URL",
            "SUPABASE_SERVICE_ROLE_KEY=$env:SUPABASE_SERVICE_ROLE_KEY",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=$env:NEXT_PUBLIC_SUPABASE_ANON_KEY",
            "",
            "BASE_URL=http://localhost:3000",
            "FINHUB_BASE_URL=http://localhost:3000"
          )
          $lines | Set-Content -Path ".env.local" -Encoding utf8

      - name: Start Next server + wait ready
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $env:PORT = "3000"
          $p = Start-Process -FilePath "pnpm" -ArgumentList "start" -PassThru -NoNewWindow
          "Started server PID: $($p.Id)" | Out-Host

          $url = "http://localhost:3000/api/debug/cookies"
          $ok = $false
          for ($i=0; $i -lt 60; $i++) {
            try {
              Invoke-WebRequest -Uri $url -UseBasicParsing | Out-Null
              $ok = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $ok) {
            try { Stop-Process -Id $p.Id -Force } catch {}
            throw "Server did not become ready at $url"
          }

          $p.Id | Set-Content -Path ".next-server.pid" -Encoding ascii

      - name: E2E - dashboard smoke
        shell: pwsh
        run: pnpm run e2e:dashboard

      - name: E2E - assistant chat
        shell: pwsh
        run: pnpm run e2e:assistant

      - name: Stop Next server
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          if (Test-Path ".next-server.pid") {
            $pid = Get-Content ".next-server.pid"
            if ($pid) { Stop-Process -Id ([int]$pid) -Force }
          }