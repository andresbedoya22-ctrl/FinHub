name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.3"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  e2e_windows:
    name: E2E (Windows) - dashboard + assistant
    needs: ci
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.3"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create .env.local for E2E (no BOM)
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if (-not $env:SUPABASE_URL) { throw "Missing secret: NEXT_PUBLIC_SUPABASE_URL" }
          if (-not $env:SUPABASE_SERVICE_ROLE_KEY) { throw "Missing secret: SUPABASE_SERVICE_ROLE_KEY" }
          if (-not $env:NEXT_PUBLIC_SUPABASE_ANON_KEY) { throw "Missing secret: NEXT_PUBLIC_SUPABASE_ANON_KEY" }

          $content = @(
            "SUPABASE_URL=$($env:SUPABASE_URL)"
            "NEXT_PUBLIC_SUPABASE_URL=$($env:SUPABASE_URL)"
            "SUPABASE_SERVICE_ROLE_KEY=$($env:SUPABASE_SERVICE_ROLE_KEY)"
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=$($env:NEXT_PUBLIC_SUPABASE_ANON_KEY)"
            ""
            "BASE_URL=http://localhost:3000"
            "FINHUB_BASE_URL=http://localhost:3000"
          ) -join "`n"

          [System.IO.File]::WriteAllText(".env.local", $content, (New-Object System.Text.UTF8Encoding($false)))

          # Safe debug: primeros 3 bytes deben ser 53 55 50 ("SUP") => sin BOM
          $b=[System.IO.File]::ReadAllBytes(".env.local")
          "{0:X2} {1:X2} {2:X2}" -f $b[0],$b[1],$b[2]

      - name: Start Next server (background) + wait ready
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $env:PORT = "3000"

          # Arranca y captura logs
          $p = Start-Process -FilePath "pnpm" -ArgumentList "start" -PassThru -NoNewWindow `
            -RedirectStandardOutput ".next-server.out.log" `
            -RedirectStandardError  ".next-server.err.log"

          "Started server PID: $($p.Id)" | Out-Host
          $p.Id | Set-Content -Path ".next-server.pid" -Encoding ASCII

          $url = "http://localhost:3000/api/debug/cookies"
          $ok = $false
          for ($i=0; $i -lt 90; $i++) {
            try {
              Invoke-WebRequest -Uri $url -UseBasicParsing | Out-Null
              $ok = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $ok) {
            "Server did not become ready at $url" | Out-Host
            if (Test-Path ".next-server.err.log") { "==== .next-server.err.log (tail 200) ====" | Out-Host; Get-Content ".next-server.err.log" -Tail 200 | Out-Host }
            if (Test-Path ".next-server.out.log") { "==== .next-server.out.log (tail 200) ====" | Out-Host; Get-Content ".next-server.out.log" -Tail 200 | Out-Host }
            throw "Server not ready"
          }

      - name: E2E - dashboard smoke
        shell: pwsh
        run: pnpm run e2e:dashboard

      - name: E2E - assistant chat
        if: success()
        shell: pwsh
        run: pnpm run e2e:assistant

      - name: Dump Next logs (always)
        if: always()
        shell: pwsh
        run: |
          "==== Dump logs ====" | Out-Host
          if (Test-Path ".next-server.pid") { "PID: $(Get-Content .next-server.pid)" | Out-Host }
          "==== .next-server.err.log (tail 300) ====" | Out-Host
          if (Test-Path ".next-server.err.log") { Get-Content ".next-server.err.log" -Tail 300 | Out-Host } else { "no err log" | Out-Host }
          "==== .next-server.out.log (tail 300) ====" | Out-Host
          if (Test-Path ".next-server.out.log") { Get-Content ".next-server.out.log" -Tail 300 | Out-Host } else { "no out log" | Out-Host }

      - name: Stop Next server
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          if (Test-Path ".next-server.pid") {
            $pid = Get-Content ".next-server.pid"
            if ($pid) { Stop-Process -Id ([int]$pid) -Force }
          }
          exit 0