openapi: 3.0.3
info:
  title: FinHub API v1
  version: 1.0.0
servers:
  - url: /api

paths:
  /stripe/webhook:
    post:
      summary: Stripe webhook (v1)
      description: Handles Stripe webhooks and updates payment state.
      tags: [Payments]
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }
  /payments/checkout:
    post:
      summary: Create Stripe Checkout Session (v1)
      description: Creates a Stripe Checkout Session and registers a payment row.
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId, productKey]
              properties:
                caseId: { type: string }
                productKey: { type: string, example: case_unlock }
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  url: { type: string }
        "401": { description: Unauthorized }
  /auth/login:
    post:
      summary: Login (email/password)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOkResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/register:
    post:
      summary: Register (email/password)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOkResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/logout:
    post:
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /documents:
    post:
      summary: Create document metadata (storage object handled separately)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDocumentResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /documents/my:
    get:
      summary: List my documents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListDocumentsResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /documents/{id}:
    patch:
      summary: Update document metadata (status/caseId/notes)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchDocumentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      summary: Delete document (also deletes storage object if storagePath exists)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/documents/signed-url:
    post:
      summary: Create signed URL for storage object (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignedUrlRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUrlResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string }

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AuthOkResponse:
      type: object
      required: [ok, userId]
      properties:
        ok: { type: boolean, enum: [true] }
        userId: { type: string, format: uuid, nullable: true }

    DocumentType:
      type: string
      enum: [id, income, bank, rental, tax, other]

    DocumentStatus:
      type: string
      enum: [uploaded, under_review, approved]

    Document:
      type: object
      required: [id, fileName, type, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        type: { $ref: "#/components/schemas/DocumentType" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        caseId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        storagePath:
          type: string
          nullable: true
          description: Path within bucket "vault" (format: "{userId}/...").
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDocumentRequest:
      type: object
      required: [fileName, type]
      properties:
        fileName: { type: string }
        type: { $ref: "#/components/schemas/DocumentType" }
        caseId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        storagePath:
          type: string
          nullable: true
          description: Optional override. If missing, server generates "{userId}/...".

    CreateDocumentResponse:
      type: object
      required: [ok, doc]
      properties:
        ok: { type: boolean, enum: [true] }
        doc: { $ref: "#/components/schemas/Document" }

    ListDocumentsResponse:
      type: object
      required: [ok, docs]
      properties:
        ok: { type: boolean, enum: [true] }
        docs:
          type: array
          items: { $ref: "#/components/schemas/Document" }

    PatchDocumentRequest:
      type: object
      properties:
        status: { $ref: "#/components/schemas/DocumentStatus" }
        caseId: { type: string, format: uuid, nullable: true }
        notes: { type: string }

    SignedUrlRequest:
      type: object
      required: [path]
      properties:
        bucket:
          type: string
          nullable: true
          description: Defaults to "vault".
        path:
          type: string
          description: Object path inside bucket (format: "{userId}/...").
        expiresIn:
          type: integer
          nullable: true
          description: Seconds (60..3600). Defaults to 300.

    SignedUrlResponse:
      type: object
      required: [ok, url]
      properties:
        ok: { type: boolean, enum: [true] }
        url: { type: string }


