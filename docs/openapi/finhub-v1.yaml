openapi: 3.0.3
info:
  title: FinHub API (v1)
  version: 1.0.0
  description: |
    Contracto OpenAPI v1 para FinHub (web-first).
    Nota: Endpoints /api/debug/* fuera de contrato.
servers:
  - url: /api
tags:
  - name: Auth
  - name: Documents
  - name: Payments
  - name: Admin

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      responses:
        "200":
          description: OK
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      responses:
        "200":
          description: OK

  /documents:
    post:
      tags: [Documents]
      summary: Create a document (DB row) for current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDocumentResponse"

  /documents/my:
    get:
      tags: [Documents]
      summary: List documents of current user
      responses:
        "200":
          description: OK

  /documents/{id}:
    get:
      tags: [Documents]
      summary: Get document by id (RLS-protected)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: OK
        "404":
          description: Not found
    patch:
      tags: [Documents]
      summary: Update document (status/case_id/notes)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchDocumentRequest"
      responses:
        "200":
          description: OK
    delete:
      tags: [Documents]
      summary: Delete document (DB row) by id
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: OK

  /documents/{id}/ocr:
    post:
      tags: [Documents]
      summary: Request OCR (mock v1) and create run + extraction + audit
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrRequestResponse"

  /documents/{id}/extraction:
    get:
      tags: [Documents]
      summary: Get latest extraction for document id
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetExtractionResponse"
    patch:
      tags: [Documents]
      summary: Update latest extraction (or create if missing) + audit "edited"
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchExtractionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchExtractionResponse"

  /documents/{id}/verify:
    post:
      tags: [Documents]
      summary: Mark extraction as user-verified + audit
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: OK

  /payments/checkout:
    post:
      tags: [Payments]
      summary: Create Stripe checkout session for current case
      responses:
        "200":
          description: OK

  /payments/status:
    get:
      tags: [Payments]
      summary: Payment status for current user/case
      responses:
        "200":
          description: OK

  /stripe/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook handler
      responses:
        "200":
          description: OK

  /admin/documents/signed-url:
    post:
      tags: [Admin]
      summary: Create signed URL for Storage object (admin only)
      responses:
        "200":
          description: OK

components:
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    DocumentType:
      type: string
      enum: [id, income, bank, rental, tax, other, machtigingsregistratie]

    DocumentStatus:
      type: string
      enum: [uploaded, under_review, approved, rejected]

    DocumentEntity:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        fileName: { type: string }
        type: { $ref: "#/components/schemas/DocumentType" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        caseId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        storagePath: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, fileName, type, status, createdAt, updatedAt]

    CreateDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        fileName: { type: string }
        type: { $ref: "#/components/schemas/DocumentType" }
        caseId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        storagePath: { type: string, nullable: true }
      required: [fileName, type]

    CreateDocumentResponse:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean }
        doc: { $ref: "#/components/schemas/DocumentEntity" }
        error: { type: string, nullable: true }
      required: [ok]

    PatchDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/DocumentStatus" }
        caseId: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    OcrRun:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        document_id: { type: string }
        status: { type: string }
        provider: { type: string }
        created_at: { type: string }

    DocumentExtraction:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        document_id: { type: string }
        run_id: { type: string, nullable: true }
        extraction_type: { type: string }
        schema_version: { type: integer }
        fields: { type: object }
        needs_review: { type: boolean }
        confidence: { type: number, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }

    OcrRequestResponse:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean }
        run: { $ref: "#/components/schemas/OcrRun" }
        extraction: { $ref: "#/components/schemas/DocumentExtraction" }
        error: { type: string, nullable: true }
      required: [ok]

    GetExtractionResponse:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean }
        extraction: { $ref: "#/components/schemas/DocumentExtraction" }
        error: { type: string, nullable: true }
      required: [ok]

    PatchExtractionRequest:
      type: object
      additionalProperties: false
      properties:
        fields:
          type: object
          additionalProperties: true
        needsReview:
          type: boolean
        confidence:
          type: number
          nullable: true

    PatchExtractionResponse:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean }
        extractionId: { type: string }
        error: { type: string, nullable: true }
      required: [ok]